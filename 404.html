<style>
:root { --night:#0e0f13; --text:#e9e3d8; --soft:#cfc8bc; --muted:#a39b8f; --faint:#6c665c; --ember:#f0a868;
  --serif:"Newsreader", Georgia, serif; --sans:"Inter", system-ui, sans-serif; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { background:var(--night); color:var(--text); font:20px/1.6 var(--serif); -webkit-font-smoothing:antialiased; overflow:hidden; }
a { color:inherit; text-decoration-color:rgba(233,227,216,.35); text-underline-offset:4px; text-decoration-thickness:1px; }
a:hover { text-decoration-color:var(--ember); color:#fff; }

/* the beach fills the screen, as on the home page */
.scene { position:fixed; inset:0; background:#0a0e1b; }
.scene iframe { display:block; width:100%; height:100%; border:0; pointer-events:none; }
.scene::after { content:""; position:absolute; left:0; right:0; top:0; height:55%;
  background:radial-gradient(ellipse 60% 70% at 50% 35%, rgba(8,10,18,.55), rgba(8,10,18,0)); }

header { position:fixed; top:0; left:0; right:0; z-index:2; padding:26px 28px; }
header a { font-size:17px; color:rgba(233,227,216,.85); text-decoration:none; }

.note { position:fixed; z-index:2; left:0; right:0; top:17vh; top:17svh; padding:0 24px; text-align:center; }
.code { font:500 12px var(--sans); letter-spacing:.16em; color:var(--muted); }
h1 { font-weight:400; font-size:40px; line-height:1.15; margin:8px 0 10px; }
.note p { color:var(--soft); font-size:19px; }
.links { margin-top:18px; font:15px var(--sans); color:var(--muted); display:flex; justify-content:center; gap:10px 26px; flex-wrap:wrap; }
.links a { text-decoration:none; }
.links a:hover { text-decoration:underline; }

@media (max-width:640px) {
  header { padding:18px 16px; }
  .note { padding:0 16px; top:15vh; top:15svh; }
  h1 { font-size:30px; }
  .note p { font-size:17px; }
}

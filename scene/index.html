<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beach fogón</title>
<link rel="icon" href="data:,">
<style>
:root { --night: #0e0f13; --text: #e9e3d8; --ember: #f0a868; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--night); height: 100%; }
body { overflow-x: hidden; }
.hero { position: relative; width: 100%; height: 100vh; height: 100svh; min-height: 420px; overflow: hidden; background: #0a0e1b; }
.hero canvas { position: absolute; display: block; pointer-events: none; }
.grain, .vignette { position: absolute; inset: 0; pointer-events: none; }
.grain { mix-blend-mode: soft-light; opacity: .32; background-size: 256px 256px; }
.vignette { background: radial-gradient(ellipse 85% 75% at 42% 58%, transparent 55%, rgba(6,7,14,.6) 100%); }
</style>
</head>
<body>
<main class="hero" id="hero" aria-label="A campfire on a dune by the sea, at night">
  <div class="grain" id="grain"></div>
  <div class="vignette"></div>
</main>
<script>
(() => {
'use strict';
const hero = document.getElementById('hero');
const grainEl = document.getElementById('grain');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const M = 40;              // overscan for parallax
const AMP = 20;            // parallax amplitude in px at depth 1

// ---------- helpers ----------
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(1);
const seed = n => { rnd = mulberry(n); };
const R = (a, b) => a + (b - a) * rnd();
const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const TAU = Math.PI * 2;

function lin(ctx, x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); for (const [o, c] of stops) g.addColorStop(o, c); return g; }
function blob(ctx, x, y, rx, ry, c, a, rot = 0) {
  if (rx <= 0 || ry <= 0) return;
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, rgba(c, a)); g.addColorStop(.5, rgba(c, a * .45)); g.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = g; ctx.fillRect(-rx, -rx, rx * 2, rx * 2); ctx.restore();
}
function dabs(ctx, n, x, y, w, h, cols, r0, r1, a0, a1, flat = .45, rot = .25) {
  for (let i = 0; i < n; i++) {
    const r = R(r0, r1);
    ctx.fillStyle = rgba(cols[(rnd() * cols.length) | 0], R(a0, a1));
    ctx.beginPath(); ctx.ellipse(R(x, x + w), R(y, y + h), r, r * flat * R(.7, 1.3), R(-rot, rot), 0, TAU); ctx.fill();
  }
}
function makeCanvas(cls, overscan) {
  const c = document.createElement('canvas'); if (cls) c.className = cls;
  c._o = overscan; hero.insertBefore(c, grainEl); return c;
}
function sizeCanvas(c, W, H, dpr) {
  const o = c._o ? M : 0;
  c.width = Math.round((W + 2 * o) * dpr); c.height = Math.round((H + 2 * o) * dpr);
  c.style.width = (W + 2 * o) + 'px'; c.style.height = (H + 2 * o) + 'px';
  c.style.left = -o + 'px'; c.style.top = -o + 'px';
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, o * dpr, o * dpr);
  return ctx;
}

// ---------- layers ----------
const cSky = makeCanvas('', true);
const cFar = makeCanvas('', true);
const cBack = makeCanvas('', false);   // stars + water shimmer (dynamic)
const cDune = makeCanvas('', true);
const cGrass = makeCanvas('', false);  // swaying grass (dynamic)
const cProps = makeCanvas('', true);
const cGlow = makeCanvas('', false);    // fire, light, sparks (dynamic; no CSS blend modes, they are costly)

const F = document.createElement('canvas'), S1 = document.createElement('canvas'), S2 = document.createElement('canvas');
const fctx = F.getContext('2d'), s1ctx = S1.getContext('2d'), s2ctx = S2.getContext('2d');
let embers = [];
let swells = [], foam = [];
let L, ctxBack, ctxGrass, ctxGlow, stars = [], dashes = [], clumps = [], sparks = [], starSprite;

function layout(W, H) {
  const P = W / H < 0.85;
  const s = P ? Math.min(W / 470, H / 820) : Math.min(W / 1440, H / 900);
  const sc = P ? Math.min(W / 540, 0.8) : s;
  const o = {
    W, H, P, s, sc, ps: s * (P ? 1.12 : 1.5),
    hz: H * (P ? .50 : .535),
    shore: H * (P ? .57 : .598),
    fenceL: H * (P ? .672 : .705), fenceR: H * (P ? .645 : .672),
    fx: W * (P ? .42 : .36), fy: H * (P ? .79 : .82),
    mx: W * (P ? .78 : .80), my: H * (P ? .15 : .19), mr: (P ? 19 : 27) * Math.max(sc, .8),
    hlStart: W * (P ? .02 : .30),
    tower: W * (P ? .64 : .655),
  };
  o.fenceY = x => o.fenceL + (o.fenceR - o.fenceL) * (x / W) + 3 * s * Math.sin(x * .004 + 1);
  o.edge = x => o.fenceY(x) + 7 * s + 6 * s * Math.sin(x * .0055 / Math.max(s, .5) + .7) + 2.5 * s * Math.sin(x * .021 + 2);
  o.hlY = x => {
    if (x < o.hlStart) return o.hz;
    const t = (x - o.hlStart) / (W * (P ? .35 : .22));
    const ramp = t >= 1 ? 1 : t * t * (3 - 2 * t);
    const hump = Math.exp(-Math.pow((x - o.tower) / (150 * sc), 2));
    return o.hz - sc * ramp * (17 + 7 * Math.sin(x * .011 / sc + 1.3) * .5 + 3 * Math.sin(x * .05) * .5 + 12 * hump);
  };
  const rx = W * (P ? .7 : .36), ry = H * (P ? .2 : .24);
  o.warm = (x, y) => Math.exp(-(((x - o.fx) / rx) ** 2 + ((y - o.fy) / ry) ** 2));
  return o;
}

// ---------- sky ----------
function paintSky(ctx) {
  const { W, H, hz, mx, my, mr, s, sc } = L; seed(11);
  ctx.fillStyle = lin(ctx, 0, -M, 0, hz, [[0, '#060914'], [.42, '#0b1225'], [.78, '#16203b'], [1, '#283050']]);
  ctx.fillRect(-M, -M, W + 2 * M, H + 2 * M);
  // faint warm-violet breath along the horizon (town light)
  blob(ctx, L.tower, hz, W * .45, H * .1, [92, 70, 92], .32);
  blob(ctx, W * .15, hz, W * .4, H * .08, [60, 58, 92], .3);
  // moon halo
  blob(ctx, mx, my, mr * 16, mr * 16, [90, 110, 160], .22);
  blob(ctx, mx, my, mr * 6, mr * 6, [170, 185, 215], .2);
  // soft cloud wisps, lit from the moon
  const clouds = L.P ? [[.2, .3, .9], [.75, .22, .6], [.45, .36, .7]] : [[.18, .24, .5], [.62, .14, .45], [.86, .33, .35], [.38, .4, .4]];
  for (const [cxF, cyF, lenF] of clouds) {
    const cx = W * cxF, cy = hz * cyF / .5 * .5 + R(-10, 10) * s, len = W * lenF * R(.8, 1.1);
    for (let j = 0; j < 70; j++) {
      const u = gauss(), x = cx + u * len * .5, thick = (1 - Math.min(1, Math.abs(u))) * 22 * s + 4 * s;
      const y = cy + gauss() * thick * .6 - Math.abs(u) * 6 * s;
      const d = Math.hypot(x - mx, y - my), lit = Math.exp(-d / (W * .3));
      const rx = R(30, 90) * s * (1.2 - Math.abs(u) * .6);
      blob(ctx, x, y, rx, rx * R(.3, .6), mix([46, 56, 90], [168, 174, 198], lit), R(.025, .055) + lit * .05);
    }
    // moonlit upper rim
    for (let j = 0; j < 16; j++) { const u = gauss() * .7, x = cx + u * len * .5, y = cy - (1 - Math.min(1, Math.abs(u))) * 14 * s; blob(ctx, x, y, R(20, 50) * s, R(4, 8) * s, [150, 160, 196], .05 + Math.exp(-Math.hypot(x - mx, y - my) / (W * .25)) * .1); }
  }
  // watercolor mottling
  for (let i = 0; i < 60; i++) { const r = R(80, 260) * s; blob(ctx, R(0, W), R(-M, hz), r, r * R(.5, 1), rnd() < .5 ? [30, 42, 78] : [2, 4, 12], .06); }
}
function paintMoon(ctx) {
  const { mx, my, mr, sc } = L;
  ctx.save();
  ctx.shadowColor = 'rgba(236,232,214,.75)'; ctx.shadowBlur = 36 * sc;
  ctx.fillStyle = '#ece6d3'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.clip();
  blob(ctx, mx - mr * .3, my - mr * .2, mr * .45, mr * .35, [180, 178, 168], .5);
  blob(ctx, mx + mr * .25, my + mr * .2, mr * .5, mr * .3, [190, 186, 172], .45);
  blob(ctx, mx + mr * .1, my - mr * .45, mr * .25, mr * .2, [175, 172, 165], .4);
  const g = ctx.createRadialGradient(mx - mr * .2, my - mr * .2, mr * .2, mx, my, mr);
  g.addColorStop(0, 'rgba(255,252,240,.25)'); g.addColorStop(.8, 'rgba(200,196,185,0)'); g.addColorStop(1, 'rgba(150,150,150,.25)');
  ctx.fillStyle = g; ctx.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
  ctx.restore();
}

// ---------- headland, town, sea, beach ----------
let lights = [];
function paintFar(ctx) {
  const { W, H, hz, shore, s, sc, mx, hlY, P } = L; seed(23);
  // sea
  ctx.fillStyle = lin(ctx, 0, hz, 0, shore + 30 * s, [[0, '#2b3454'], [.05, '#1e2744'], [.6, '#151d35'], [1, '#111830']]);
  ctx.fillRect(-M, hz - 2, W + 2 * M, H - hz + M);
  // haze at horizon
  ctx.fillStyle = lin(ctx, 0, hz - 6 * s, 0, hz + 10 * s, [[0, 'rgba(110,122,160,0)'], [.45, 'rgba(110,122,160,.25)'], [1, 'rgba(110,122,160,0)']]);
  ctx.fillRect(-M, hz - 6 * s, W + 2 * M, 16 * s);
  // painted swell strokes
  for (let i = 0; i < 700; i++) {
    const y = hz + (shore - hz) * Math.pow(rnd(), 1.25), t = (y - hz) / (shore - hz);
    const nearMoon = rnd() < .3;
    const x = nearMoon ? mx + gauss() * (10 + 70 * t) * sc : R(-M, W + M);
    const len = R(8, 50) * s * (.35 + t);
    const light = rnd() < .65;
    ctx.fillStyle = light ? rgba([130, 150, 196], R(.03, .08) + (nearMoon ? .06 : 0)) : rgba([6, 10, 22], R(.08, .18));
    ctx.beginPath(); ctx.ellipse(x, y, len, (.5 + 1.2 * t) * s, 0, 0, TAU); ctx.fill();
  }
  // steady moon column under the shimmer
  for (let y = hz + 2; y < shore; y += 3) {
    const t = (y - hz) / (shore - hz);
    blob(ctx, mx + Math.sin(y * .3) * 2, y, (8 + 60 * t) * sc, 2.4 * s, [180, 190, 215], .1);
  }
  // town
  lights = [];
  const blocks = P
    ? [[-170, 40, 30], [-125, 34, 40], [-84, 28, 26], [44, 48, 38], [100, 40, 32], [146, 30, 22]]
    : [[-205, 34, 24], [-162, 42, 32], [-112, 38, 42], [-70, 28, 26], [42, 50, 38], [104, 44, 34], [156, 36, 26], [205, 30, 20]];
  for (const [dx, w, h] of blocks) paintBlock(ctx, L.tower + dx * sc, w * sc, h * sc);
  // headland body
  ctx.beginPath(); ctx.moveTo(L.hlStart - 4, hz + 1);
  for (let x = L.hlStart; x <= W + M; x += 3) ctx.lineTo(x, hlY(x));
  ctx.lineTo(W + M, hz + 1); ctx.closePath();
  ctx.fillStyle = '#121828'; ctx.fill();
  ctx.save(); ctx.clip();
  dabs(ctx, 260, L.hlStart, hz - 50 * sc, W - L.hlStart + M, 50 * sc, [[26, 34, 54], [14, 18, 30], [34, 42, 64]], 3 * sc, 10 * sc, .25, .5, .6);
  ctx.restore();
  // trees and scrub along the ridge
  for (let x = L.hlStart + 8; x < W + M; x += R(5, 12) * sc) {
    const y = hlY(x), r = R(3, 8) * sc * Math.min(1, (L.hz - y) / (8 * sc) + .2);
    ctx.fillStyle = rgba(mix([14, 18, 30], [20, 26, 42], rnd()), 1);
    ctx.beginPath(); ctx.ellipse(x, y + r * .4, r * 1.2, r, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(70,82,118,.22)';
    ctx.beginPath(); ctx.ellipse(x + r * .35, y - r * .1, r * .55, r * .35, 0, 0, TAU); ctx.fill();
  }
  // a few lamps near the waterline
  for (let i = 0; i < 9; i++) {
    const x = R(L.tower - 260 * sc, L.tower + 260 * sc); if (x < L.hlStart + 20) continue;
    lights.push([x, hz - 2 * sc, 1.2]);
    ctx.fillStyle = 'rgba(244,196,130,.75)'; ctx.beginPath(); ctx.arc(x, hz - 2 * sc, 1.1 * sc, 0, TAU); ctx.fill();
  }
  // headland reflection: a dark band
  ctx.beginPath(); ctx.moveTo(L.hlStart, hz);
  for (let x = L.hlStart; x <= W + M; x += 4) ctx.lineTo(x, hz + (hz - hlY(x)) * .45);
  ctx.lineTo(W + M, hz); ctx.closePath(); ctx.fillStyle = 'rgba(8,12,24,.45)'; ctx.fill();
  // warm light reflections
  for (const [x, y, k] of lights) {
    const d = hz - y;
    for (let j = 0; j < 9; j++) {
      const yy = hz + 2 * sc + d * .25 + j * R(2.5, 4.5) * sc;
      if (yy > shore - 4) break;
      ctx.fillStyle = rgba([240, 170, 100], .28 * k * (1 - j / 9));
      ctx.fillRect(x - R(.6, 2) * sc + Math.sin(j * 1.7) * sc, yy, R(1.5, 4) * sc, .9 * sc);
    }
  }
  // beach strip
  ctx.fillStyle = lin(ctx, 0, shore, 0, L.fenceL + 20 * s, [[0, '#3a4058'], [1, '#2a2f45']]);
  ctx.beginPath(); ctx.moveTo(-M, shore);
  for (let x = -M; x <= W + M; x += 6) ctx.lineTo(x, shore + 1.5 * s * Math.sin(x * .02) + s * Math.sin(x * .07));
  ctx.lineTo(W + M, H + M); ctx.lineTo(-M, H + M); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  // wet sand sheen
  ctx.fillStyle = lin(ctx, 0, shore, 0, shore + 9 * s, [[0, 'rgba(130,145,185,.35)'], [1, 'rgba(130,145,185,0)']]);
  ctx.fillRect(-M, shore, W + 2 * M, 9 * s);
  blob(ctx, mx, shore + 4 * s, 80 * sc, 4 * s, [200, 205, 220], .35);
  dabs(ctx, 260, -M, shore, W + 2 * M, 50 * s, [[70, 76, 100], [42, 46, 66], [86, 90, 112]], 4 * s, 16 * s, .05, .12, .3);
  ctx.restore();
}
function paintBlock(ctx, x, w, h) {
  const { sc } = L, base = L.hlY(x + w / 2) + 3 * sc, top = base - h, side = w * .22;
  ctx.fillStyle = '#1a2034'; ctx.fillRect(x - side, top + 2 * sc, side, h);
  ctx.fillStyle = lin(ctx, x, 0, x + w, 0, [[0, '#283050'], [1, '#3a4565']]);
  ctx.fillRect(x, top, w, h);
  ctx.fillStyle = 'rgba(150,165,205,.28)'; ctx.fillRect(x, top, w, 1.2 * sc);
  for (let y = top + 5 * sc; y < base - 3 * sc; y += 5 * sc) {
    ctx.fillStyle = 'rgba(10,14,26,.35)'; ctx.fillRect(x, y, w, .8 * sc);
    for (let wx = x + 2.5 * sc; wx < x + w - 3 * sc; wx += 5 * sc) {
      if (rnd() < .09) litWindow(ctx, wx, y - 3.2 * sc, 2.4 * sc, 2.4 * sc);
    }
  }
}
function paintTower(ctx, cx, w, h) {
  const { sc } = L, base = L.hlY(cx) + 3 * sc, top = base - h, x = cx - w / 2;
  ctx.fillStyle = lin(ctx, x, 0, x + w, 0, [[0, '#171c2f'], [.45, '#2c3554'], [.85, '#4a5679'], [1, '#353f5e']]);
  ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x, top + w * .35);
  ctx.quadraticCurveTo(x, top, cx, top); ctx.quadraticCurveTo(x + w, top, x + w, top + w * .35);
  ctx.lineTo(x + w, base); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a3250'; ctx.fillRect(cx - 1 * sc, top - 7 * sc, 2 * sc, 7 * sc);
  ctx.fillStyle = 'rgba(244,120,90,.8)'; ctx.beginPath(); ctx.arc(cx, top - 7 * sc, 1 * sc, 0, TAU); ctx.fill();
  for (let y = top + 9 * sc; y < base - 3 * sc; y += 4.2 * sc) {
    ctx.fillStyle = 'rgba(8,12,24,.3)'; ctx.fillRect(x, y, w, .7 * sc);
    for (let wx = x + 2 * sc; wx < x + w - 3 * sc; wx += 4.5 * sc) if (rnd() < .11) litWindow(ctx, wx, y - 2.8 * sc, 2 * sc, 2.2 * sc);
  }
}
function litWindow(ctx, x, y, w, h) {
  ctx.save(); ctx.shadowColor = 'rgba(245,170,90,.9)'; ctx.shadowBlur = 5 * L.sc;
  ctx.fillStyle = rnd() < .8 ? '#f3bd78' : '#f6dca8'; ctx.fillRect(x, y, w, h); ctx.restore();
  lights.push([x + w / 2, y, .8]);
}

// ---------- dune, ripples, fence ----------
function paintDune(ctx) {
  const { W, H, s, fx, fy, edge, fenceY, warm, P } = L; seed(37);
  let minE = H; for (let x = -M; x <= W + M; x += 10) minE = Math.min(minE, edge(x));
  ctx.beginPath(); ctx.moveTo(-M, edge(-M));
  for (let x = -M; x <= W + M; x += 4) ctx.lineTo(x, edge(x));
  ctx.lineTo(W + M, H + M); ctx.lineTo(-M, H + M); ctx.closePath();
  ctx.fillStyle = lin(ctx, 0, minE, 0, H, [[0, '#4a5169'], [.12, '#353b52'], [.45, '#22263a'], [1, '#0e0f18']]);
  ctx.fill();
  ctx.save(); ctx.clip();
  const area = (W * H) / (1440 * 900);
  dabs(ctx, 900 * area + 300, -M, minE, W + 2 * M, H - minE + M, [[70, 78, 104], [46, 52, 74], [26, 30, 46], [86, 94, 120]], 6 * s, 28 * s, .035, .09, .3, .15);
  // directional brush strokes on the slope
  for (let i = 0; i < 260 * area + 80; i++) { const y = R(minE, H), p = (y - minE) / (H - minE), r = R(20, 70) * s * (.5 + p); ctx.fillStyle = rgba(rnd() < .5 ? [96, 104, 134] : [12, 12, 22], R(.04, .08)); ctx.beginPath(); ctx.ellipse(R(-M, W + M), y, r, r * R(.08, .16), R(-.12, .06), 0, TAU); ctx.fill(); }
  // moonlit upper slope
  ctx.fillStyle = lin(ctx, 0, minE, 0, minE + 90 * s, [[0, 'rgba(120,128,160,.28)'], [1, 'rgba(120,128,160,0)']]); ctx.fillRect(-M, minE - 20 * s, W + 2 * M, 110 * s);
  // watercolor washes
  for (let i = 0; i < 40; i++) { const r = R(80, 260) * s; blob(ctx, R(-M, W + M), R(minE, H), r, r * R(.25, .45), [[50, 64, 104], [14, 16, 28], [70, 74, 108], [36, 52, 80]][(rnd() * 4) | 0], R(.08, .16)); }
  // wind ripples: soft, few, following the slope
  for (let i = 0; i < 70; i++) {
    const y0 = R(minE + 25 * s, H + 10), p = (y0 - minE) / (H - minE);
    const x0 = R(-M, W), len = R(80, 260) * s * (.6 + p), amp = R(2, 5) * s * (.5 + p), ph = R(0, 6), k = R(.015, .03) / s;
    for (const [dy, col, lw] of [[0, [118, 122, 150, .09], 1.6], [2.2, [14, 15, 24, .13], 1.8]]) {
      ctx.beginPath();
      for (let x = x0; x < x0 + len; x += 6) {
        const tt = (x - x0) / len, y = y0 + dy * s * (.6 + p) + Math.sin(x * k + ph) * amp - tt * 8 * s;
        x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = rgba(col, col[3]); ctx.lineWidth = lw * s * (.6 + p); ctx.lineCap = 'round'; ctx.stroke();
    }
  }
  // moonlit crest
  ctx.restore();
  ctx.save();
  ctx.beginPath(); for (let x = -M; x <= W + M; x += 4) x === -M ? ctx.moveTo(x, edge(x)) : ctx.lineTo(x, edge(x));
  ctx.strokeStyle = 'rgba(150,156,186,.28)'; ctx.lineWidth = 2.5 * s; ctx.shadowColor = 'rgba(150,156,186,.5)'; ctx.shadowBlur = 8 * s; ctx.stroke();
  ctx.restore();
  // baked firelight on the sand
  const rx = W * (P ? .8 : .46), ry = rx * (P ? .45 : .36);
  ctx.save(); ctx.translate(fx, fy + 10 * s); ctx.scale(1, ry / rx);
  let g0 = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * .95);
  g0.addColorStop(0, 'rgba(206,132,76,.95)'); g0.addColorStop(.25, 'rgba(168,100,64,.7)'); g0.addColorStop(.55, 'rgba(100,68,72,.35)'); g0.addColorStop(.8, 'rgba(70,62,82,.12)'); g0.addColorStop(1, 'rgba(60,60,80,0)');
  ctx.fillStyle = g0; ctx.fillRect(-rx, -rx, rx * 2, rx * 2); ctx.restore();

  ctxBack = sizeCanvas(cBack, W, H, dd);
  ctxGrass = sizeCanvas(cGrass, W, H, dd);
  ctxGlow = sizeCanvas(cGlow, W, H, Math.min(dpr, 1.25));
  F.width = Math.ceil(260 * L.ps); F.height = Math.ceil(240 * L.ps);
  S1.width = Math.max(8, F.width >> 2); S1.height = Math.max(8, F.height >> 2);
  S2.width = Math.max(4, Math.round(F.width / 10)); S2.height = Math.max(4, Math.round(F.height / 10));
  buildDynamic();
  if (reduce) { for (let i = 0; i < 30; i++) drawGlow(ctxGlow, 4 + i * .1, .1, 0, 0); frame(performance.now(), true); }
}

let px = 0, py = 0, tx = 0, ty = 0, last = 0;
function frame(now, once) {
  const dt = last ? Math.min(.05, (now - last) / 1000) : 0; last = now;
  if (!reduce) { T += dt; px += (tx - px) * Math.min(1, dt * 2.5); py += (ty - py) * Math.min(1, dt * 2.5); }
  const ox = -px * AMP, oy = -py * AMP * .5;
  cSky.style.transform = `translate3d(${(ox * .12).toFixed(2)}px,${(oy * .12).toFixed(2)}px,0)`;
  cFar.style.transform = `translate3d(${(ox * .3).toFixed(2)}px,${(oy * .3).toFixed(2)}px,0)`;
  cDune.style.transform = `translate3d(${(ox * .6).toFixed(2)}px,${(oy * .6).toFixed(2)}px,0)`;
  cProps.style.transform = `translate3d(${ox.toFixed(2)}px,${oy.toFixed(2)}px,0)`;
  const t = reduce ? 4 : T;
  drawBack(ctxBack, t, ox, oy);
  drawGrass(ctxGrass, t, ox, oy);
  drawGlow(ctxGlow, t, reduce ? 0 : dt, ox, oy);
  if (!reduce && !once) requestAnimationFrame(frame);
}

makeGrain(); makeStarSprite(); build();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { build(); if (reduce) frame(performance.now(), true); }, 150); });
if (!reduce) {
  addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; tx = (e.clientX / innerWidth) * 2 - 1; ty = (e.clientY / innerHeight) * 2 - 1; });
  document.addEventListener('mouseleave', () => { tx = ty = 0; });
  const onOri = e => { if (e.gamma == null || e.beta == null) return; tx = clamp(e.gamma / 22, -1, 1); ty = clamp((e.beta - 50) / 25, -1, 1); };
  try {
    if (typeof DeviceOrientationEvent !== 'undefined') {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        addEventListener('touchend', () => { DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') addEventListener('deviceorientation', onOri); }).catch(() => {}); }, { once: true });
      } else addEventListener('deviceorientation', onOri);
    }
  } catch (e) {}
  requestAnimationFrame(frame);
}
})();
</script>
</body>
</html>
